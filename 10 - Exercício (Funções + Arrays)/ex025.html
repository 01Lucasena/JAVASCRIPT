<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <section>
        <div class="form">
            <input id="numero" type="number " 
            placeholder="Digite um Número (Entre 1 e 100)">
            <button id="adicionar" class="botao-adicionar" onclick="adicionarNumero()">Adicionar</button>
            <div id="resposta"></div>
        </div>
        <div class="resultado">
            <select name="lista" id="lista" size="10"></select>
            <button class="botao-analisar" onclick="executarCalculos()">Analisar</button>
        </div>
        
    </section>
    <footer>
        <p>Desevolvido por: Lucas Sena</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
